[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

[program:web]
command=php -d display_errors=1 -d output_buffering=0 -d max_input_vars=1000 -d variables_order=GPCS -S 0.0.0.0:5000 -t /app/public
autorestart=true
startretries=10
stdout_logfile=/tmp/web.log
redirect_stderr=true

[program:bot]
command=node /app/bot.js
autorestart=true
startretries=10
stdout_logfile=/tmp/bot.log
redirect_stderr=true
